<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found — BransonBlastUSA</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-page { text-align: center; padding: 60px 20px; max-width: 560px; margin: 0 auto; }
    .error-page .code { font-size: 6rem; font-weight: 900; color: #e0e7ef; line-height: 1; margin-bottom: 8px; }
    .error-page h1 { font-size: 1.8rem; margin-bottom: 12px; }
    .error-page p { color: #4a5568; margin-bottom: 28px; }
    .error-links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn { display: inline-block; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 700; background: #1a56db; color: white; }
    .btn.secondary { background: #e5e7eb; color: #111; }
  </style>
</head>
<body>
  <main>
    <div class="error-page">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>Sorry, we couldn’t find that page. It may have moved or been removed.</p>
      <div class="error-links">
        <a class="btn" href="/">Go Home</a>
        <a class="btn secondary" href="/advertise-branson.html">Advertise</a>
      </div>
    </div>
  </main>
</body>
</html>
